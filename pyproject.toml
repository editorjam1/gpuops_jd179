[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "editorjam1-gpuops_jd179"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出GPU 集群运维工程师·标注一致性与标注者偏差上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "editorjam1" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://editorjam1.github.io"
Repository = "https://github.com/editorjam1/gpuops_jd179"
Issues = "https://github.com/editorjam1/gpuops_jd179/issues"

[project.scripts]
gpuops_jd179 = "gpuops_jd179:main"

[tool.setuptools]
py-modules = ["gpuops_jd179"]
